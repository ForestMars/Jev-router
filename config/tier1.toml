# config/tier1.toml
# Starter pattern set for Tier 1. Matching is case-insensitive and only counts
# hits inside the first imperative_zone_bytes of the prompt.

[fuzzy]
max_distance = 1
imperative_zone_bytes = 48

# Each strong hit adds 0.35 to a 0.5 baseline, so one hit clears the 0.78 jev bar.
[jev_strong]
exact = [
    "time in ",
    "square root of",
    "factorial",
    "% of ",
]
fuzzy = ["factorial"]

# Each moderate hit adds 0.15.
[jev_moderate]
exact = [
    "how many ",
    "what time",
    "what day",
    "how tall",
    "exchange rate",
]
fuzzy = []

[llm_strong]
exact = [
    "write ",
    "draft ",
    "summarize",
    "explain ",
    "compare ",
    "brainstorm",
    "rewrite ",
    "analyze",
    "outline",
    "critique",
    "refactor",
    "debug ",
]
fuzzy = [
    "summarize",
    "explain",
    "compare",
    "brainstorm",
    "rewrite",
    "analyze",
    "outline",
    "critique",
    "refactor",
]

# A match at the start of the prompt decides LLM immediately.
[llm_prefixes]
exact = [
    "write ",
    "draft ",
    "summarize",
    "explain ",
    "rewrite ",
    "compare ",
    "brainstorm",
    "help me ",
    "give me ",
    "create ",
    "generate ",
]
fuzzy = []

# Empty on purpose: the polar yes/no fast path resolves any short question
# that starts with a polar word to jev at 0.9, regardless of content.
[polar_starts]
exact = []
fuzzy = []

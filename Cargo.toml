[package]
name = "cascade-router"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
fasttext = "0.8.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
aho-corasick = "1.1.5"
arc-swap = "1.9.2"
strsim = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
toml = "1.1.6"
tracing-opentelemetry = "0.34.0"
tracing-loki = "0.2.7"
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = "0.33.0"
url = "2.5.8"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[dev-dependencies]
proptest = "1.4"
